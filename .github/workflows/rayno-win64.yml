# 64-bit Windows build of RAYNODesk using the Flutter UI.
#
# The 32-bit build stays on the legacy Sciter UI (see rayno-win32.yml). Flutter
# has no i686 Windows target, so this workflow covers x64 only.
#
# flutter-build.yml builds every platform in its matrix (Windows, macOS, Linux,
# Android, Web) and cannot be restricted, so this wrapper reuses it as-is and
# adds a RAYNODesk-branded release on top of its x64 artifact.
name: RAYNODesk Windows 64-bit

on:
  workflow_dispatch:
  push:
    branches:
      - rayno-branding
    paths:
      - "flutter/**"
      - "src/**"
      - "libs/**"
      - "build.py"
      - ".github/patches/**"
      - ".github/workflows/rayno-win64.yml"
      - ".github/workflows/flutter-build.yml"
      - ".github/workflows/bridge.yml"
      - ".github/workflows/third-party-RustDeskTempTopMostWindow.yml"
  schedule:
    - cron: "0 4 * * 1"

env:
  VERSION: "1.5.0"

jobs:
  run-flutter-x64-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"

  publish-release:
    name: Publish RAYNODesk x64 release
    # Needs the upstream x64 Windows artifact from the build job above.
    needs: run-flutter-x64-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download the x64 Flutter artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Name comes from the "Upload unsigned" step of
          # build-for-windows-flutter in flutter-build.yml.
          name: rustdesk-unsigned-windows-x86_64
          path: ./artifact

      - name: Collect the Windows x64 binaries
        run: |
          set -eu
          # flutter-build.yml moves runner/Release to ./rustdesk before uploading,
          # so the artifact root is the Release directory itself. The whole folder
          # is needed: a Flutter app only runs with its bundled DLLs next to it.
          mkdir -p publish
          cp -r artifact/. publish/
          ls -l publish
          if [ ! -f publish/rustdesk.exe ]; then
            echo "rustdesk.exe not found in the downloaded artifact" >&2
            exit 1
          fi
          mv publish/rustdesk.exe publish/RAYNODesk.exe

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: RAYNODesk-${{ env.VERSION }}-x64-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            ./publish/RAYNODesk.exe
            ./publish/*.dll