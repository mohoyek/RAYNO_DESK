# 32-bit Windows build for RAYNODesk.
#
# Upstream builds 32-bit Windows with the legacy Sciter UI (the Flutter matrix's
# i686-pc-windows-msvc entry is commented out in flutter-build.yml), so this runs only
# that i686 sciter job instead of calling flutter-build.yml, which would also build
# x64/arm64 Windows, macOS, Android, Linux, AppImage, Flatpak and Web.
name: RAYNODesk Windows 32-bit

on:
  workflow_dispatch:
  push:
    branches:
      - rayno-branding
  schedule:
    - cron: "0 3 * * 0"

env:
  LLVM_VERSION: "15.0.6"
  VERSION: "1.5.0"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Keep in sync with VCPKG_COMMIT_ID in flutter-build.yml.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"

jobs:
  build-for-windows-sciter:
    name: i686-pc-windows-msvc
    runs-on: windows-2022

    permissions:
      contents: write

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # no release tag; commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          # Sciter's abi_thiscall feature requires nightly Rust.
          # Use an i686 host toolchain so build scripts can load the 32-bit LLVM installed above.
          # Since rustup 1.29.1, i686 toolchains on x64 Windows require --force-non-host
          # for both installation and default selection, even though WOW64 can run them.
          rustup toolchain install nightly-2023-10-13-i686-pc-windows-msvc \
            --target i686-pc-windows-msvc --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-i686-pc-windows-msvc --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-sciter

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x86-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x86-windows-static-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        shell: bash
        run: |
          python3 res/inline-sciter.py
          # Patch sciter x86
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          # Rename before packing so the extracted process is RAYNODesk.exe, not rustdesk.exe.
          mv ./target/release/rustdesk.exe ./Release/RAYNODesk.exe
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          # Do not remove x64 files, because the user may run the 32bit version on a 64bit system.
          # Do not remove ./usbmmidd_v2/deviceinstaller64.exe, as x86 exe cannot install and
          # uninstall drivers when running on x64, we need the x64 exe to install and
          # uninstall the driver.
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: find Runner.res
        # Runner.res is compiled from ./flutter/windows/runner/Runner.rc and carries the
        # version info; keep it next to the packer sources so generate.py can embed it.
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == ""; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Upload unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raynodesk-unsigned-windows-x86
          path: Release

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/RAYNODesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/RAYNODesk-${{ env.VERSION }}-x86.exe

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        # Published unsigned when SIGN_BASE_URL is unset: the portable exe needs no
        # signing secret to be usable, only to be free of the SmartScreen warning.
        with:
          prerelease: true
          # New tag per run, so every build gets its own release instead of overwriting
          # the previous one. The asset name stays stable inside that release. Without
          # target_commitish the new tag would point at the default branch, not the
          # commit that was just built.
          tag_name: RAYNODesk-${{ env.VERSION }}-x86-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            ./SignOutput/RAYNODesk-*.exe